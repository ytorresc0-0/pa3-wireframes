<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wireframes mobile – Tony's Chocolonely</title>
<style>
:root{--bg:#e9e9e9;--card:#fff;--ink:#222;--mute:#777;--ph:#dcdcdc;--line:#b5b5b5;--acc:#1e4fc4;--btn:#222;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#242424;--ink:#eee;--mute:#999;--ph:#383838;--line:#555;--acc:#8aa9ff;--btn:#eee;--btnt:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--card:#242424;--ink:#eee;--mute:#999;--ph:#383838;--line:#555;--acc:#8aa9ff;--btn:#eee;--btnt:#111;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--ink);color:var(--bg);font-size:12px}
.bar select{padding:5px;border-radius:6px;max-width:100%}
.page{max-width:390px;margin:14px auto;background:var(--card);border:3px solid var(--ink);border-radius:20px;overflow:hidden}
.hd{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--line);background:var(--ph)}
.hd a,.hd button{color:var(--ink);text-decoration:none;font-weight:700}
.hd button{background:none;border:2px solid var(--ink);border-radius:6px;font-size:18px;padding:2px 9px;cursor:pointer;color:var(--ink)}
.logo{flex:1;text-align:center;border:2px solid var(--ink);padding:3px 0;font-weight:700}
.sb{margin:10px 14px 0;padding:9px 12px;border:2px solid var(--line);color:var(--mute);border-radius:20px;font-size:13px}
#mn{display:none;border-bottom:2px solid var(--line);background:var(--card)}
#mn.on{display:block}#mn a{display:block;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;text-decoration:none}
main{padding:14px;min-height:430px}
h1{margin:6px 0 10px;font-size:22px}h2{font-size:16px;margin:20px 0 8px}
.bc{font-size:11px;color:var(--mute);margin-bottom:6px}.bc a{color:var(--mute)}
.ph{background:var(--ph);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);padding:6px;font-size:12px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.cd{border:2px solid var(--line);padding:8px;color:var(--ink);text-decoration:none;display:block;font-size:13px}
.cd .ph{height:90px;margin-bottom:6px}
.btn{display:block;text-align:center;padding:12px;background:var(--btn);color:var(--btnt);text-decoration:none;font-weight:700;border:2px solid var(--btn);border-radius:8px;margin-top:12px}
.btn.s{background:transparent;color:var(--ink);border-color:var(--ink)}
a.lk{color:var(--acc);font-size:13px}
.f{display:block;margin:10px 0}.f span{display:block;font-size:12px;color:var(--mute)}
.f i{display:block;border:2px solid var(--line);padding:10px;font-style:normal;color:var(--mute);border-radius:6px}
.st{display:flex;gap:4px;margin-bottom:12px}.st b{flex:1;text-align:center;padding:4px 0;border:2px solid var(--line);font-size:10px;border-radius:20px;font-weight:400}
.st b.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.c{text-align:center;margin:24px 0}.c .ph{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;font-size:28px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:2px solid var(--line);padding:7px 4px;text-align:left}
.ft{padding:14px;border-top:2px solid var(--line);background:var(--ph);font-size:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ft a{color:var(--ink);display:block;padding:3px 0}
</style>
</head>
<body>
<div class="bar"><b>Wireframes mobile · Tony's Chocolonely</b><label>Ir a: <select id="sel"></select></label><span id="grp"></span></div>
<div class="page"><header class="hd"><button id="bm" aria-label="Menú">☰</button><a href="#inicio" class="logo">Tony's</a><a href="#categorias" aria-label="Buscar">🔍</a><a href="#carrito" aria-label="Carrito">🛒</a></header><nav id="mn"></nav><div class="sb">Buscar chocolates…</div><main id="m"></main><footer class="ft" id="ft"></footer></div>
<script>
const A=(t,x,c='')=>`<a href="#${t}" class="${c}">${x}</a>`;
const B=(t,x,c='')=>A(t,x,'btn '+c);
const P=(x,h=90)=>`<div class="ph" style="height:${h}px">${x}</div>`;
const F=(l,v='')=>`<label class="f"><span>${l}</span><i>${v||'&nbsp;'}</i></label>`;
const ST=n=>`<div class="st">${['1 Carrito','2 Envío','3 Pago','4 Listo'].map((x,i)=>`<b class="${i+1==n?'on':''}">${x}</b>`).join('')}</div>`;
const BC=(...a)=>`<div class="bc">${a.join(' › ')}</div>`;
const CARDS=(n,t,lab)=>`<div class="grid">${Array.from({length:n},(_,i)=>A(t,`${P('Foto')}<b>${lab(i)}</b>`,'cd')).join('')}</div>`;
const STATIC=(t,x)=>BC(A('inicio','Inicio'),t)+`<h1>${t}</h1>${P('Foto / video',170)}<p>${x}</p><p>Texto descriptivo del contenido estático.</p>`;
const SCR={
inicio:['Base','Inicio',()=>`${P('Banner: misión de la marca',190)}${B('categorias','Ver chocolates')}<h2>Nuestros chocolates</h2>${CARDS(4,'subcategorias',i=>['Barras de leche','Barras negras','Sabores especiales','Packs y regalos'][i])}<h2>Únete a la causa</h2>${P('Imagen',100)}<p>Texto breve invitando a la comunidad.</p>${B('comunidad','Quiero unirme','s')}`],
categorias:['Comprar','Categorías (elegir categoría)',()=>`${BC(A('inicio','Inicio'),'Chocolates')}<h1>Chocolates</h1>${CARDS(4,'subcategorias',i=>['Barras de leche','Barras negras','Sabores especiales','Packs y regalos'][i])}`],
subcategorias:['Comprar','Subcategorías (elegir producto)',()=>`${BC(A('inicio','Inicio'),A('categorias','Chocolates'),'Barras de leche')}<h1>Barras de leche</h1><div class="sb" style="margin:0 0 12px">Ordenar / filtrar ▾</div>${CARDS(6,'contenido',i=>'Producto '+(i+1)+'<br>S/ 00.00')}`],
contenido:['Comprar','Contenido específico (producto)',()=>`${BC(A('inicio','Inicio'),A('subcategorias','Barras de leche'),'Producto 1')}${P('Foto del producto',230)}<h1>Nombre del chocolate</h1><p><b>S/ 00.00</b></p><p>Descripción, ingredientes e información de origen del cacao.</p>${F('Cantidad','1')}${B('carrito','Agregar al carrito')}`],
carrito:['Comprar','Carrito (agregar al carrito)',()=>`${ST(1)}<h1>Tu carrito</h1><table><tr><th>Producto</th><th>Cant.</th><th>Precio</th></tr><tr><td>Producto 1</td><td>1</td><td>S/ 00.00</td></tr><tr><td>Producto 2</td><td>1</td><td>S/ 00.00</td></tr></table><p><b>Total: S/ 00.00</b></p>${A('categorias','Seguir comprando','lk')}${B('envio','Continuar con el envío')}`],
envio:['Comprar','Datos de envío',()=>`${ST(2)}<h1>Datos de envío</h1>${F('Nombre completo')}${F('Dirección')}${F('Distrito / ciudad')}${F('Teléfono')}${B('pago','Continuar al pago')}${B('carrito','Volver','s')}`],
pago:['Comprar','Pago',()=>`${ST(3)}<h1>Pago</h1><p>Método: ◉ Tarjeta &nbsp; ○ Billetera digital</p>${F('Número de tarjeta')}${F('Vencimiento')}${F('Código de seguridad')}${B('confirmacion','Pagar')}${B('envio','Volver','s')}`],
confirmacion:['Comprar','Confirmación de compra',()=>`${ST(4)}<div class="c">${P('✓')}<h1>¡Pedido confirmado!</h1><p>Te enviamos el resumen a tu correo.</p>${B('inicio','Volver al inicio')}</div>`],
registro:['Registrarse','Crear cuenta',()=>`${BC(A('inicio','Inicio'),'Mi cuenta')}<h1>Crear cuenta</h1>${F('Correo electrónico')}${F('Contraseña')}${B('datos','Crear cuenta')}<p>¿Ya tienes cuenta? ${A('inicio','Inicia sesión','lk')}</p>`],
datos:['Registrarse','Llenar datos',()=>`<h1>Cuéntanos sobre ti</h1>${F('Nombre')}${F('Apellido')}${F('País')}<p>☐ Acepto los términos y condiciones</p>${B('correo','Continuar')}${B('registro','Volver','s')}`],
correo:['Registrarse','Confirmar correo',()=>`<h1>Confirma tu correo</h1><p>Ingresa el código que enviamos a tu correo.</p>${F('Código de 6 dígitos')}${B('cuenta','Confirmar')}<p>${A('datos','Corregir mis datos','lk')}</p>`],
cuenta:['Registrarse','Cuenta creada',()=>`<div class="c">${P('✓')}<h1>¡Cuenta creada!</h1><p>Ya puedes comprar y unirte a la comunidad.</p>${B('inicio','Ir al inicio')}</div>`],
comunidad:['Comunidad','Comunidad (ir a Comunidad)',()=>`${BC(A('inicio','Inicio'),'Comunidad')}<h1>Comunidad</h1><div class="cd">${P('Imagen')}<b>Newsletter</b><p>Novedades y acciones de la marca.</p>${B('newsletter','Suscribirme')}</div><br><div class="cd">${P('Imagen')}<b>Únete a la causa</b><p>Información sobre cómo participar.</p></div>`],
newsletter:['Comunidad','Ingresar correo',()=>`<h1>Suscríbete</h1>${F('Correo electrónico')}${B('terminos','Continuar')}${B('comunidad','Volver','s')}`],
terminos:['Comunidad','Aceptar términos',()=>`<h1>Términos</h1>${P('Texto de términos y política de privacidad',120)}<p>☐ Acepto los términos</p>${B('bienvenida','Suscribirme')}${B('newsletter','Corregir correo','s')}`],
bienvenida:['Comunidad','Mensaje de bienvenida',()=>`<div class="c">${P('✓')}<h1>¡Bienvenido/a!</h1><p>Ya eres parte de la comunidad.</p>${B('inicio','Volver al inicio')}</div>`],
nosotros:['Estática','Nosotros (contenido estático)',()=>STATIC('Nosotros','Quiénes somos y cómo nació la marca.')],
mision:['Estática','Nuestra misión',()=>STATIC('Nuestra misión','Qué busca la marca y cómo trabaja.')]
};
document.getElementById('mn').innerHTML=A('inicio','Inicio')+A('categorias','Chocolates')+A('carrito','Comprar')+A('mision','Nuestra misión')+A('comunidad','Comunidad')+A('registro','Mi cuenta')+A('nosotros','Nosotros');
document.getElementById('ft').innerHTML=`<div><b>Tony's</b>${A('nosotros','Nosotros')}${A('mision','Misión')}</div><div><b>Tienda</b>${A('categorias','Chocolates')}${A('carrito','Carrito')}</div><div><b>Ayuda</b>${A('registro','Mi cuenta')}${A('comunidad','Comunidad')}</div>`;
const mn=document.getElementById('mn');document.getElementById('bm').onclick=()=>mn.classList.toggle('on');
const sel=document.getElementById('sel');const g={};
Object.entries(SCR).forEach(([id,s])=>{(g[s[0]]=g[s[0]]||[]).push([id,s[1]])});
sel.innerHTML=Object.entries(g).map(([k,a])=>`<optgroup label="${k}">${a.map(([id,t])=>`<option value="${id}">${t}</option>`).join('')}</optgroup>`).join('');
sel.onchange=()=>{location.hash=sel.value};
function go(){const id=location.hash.slice(1);const k=SCR[id]?id:'inicio';const s=SCR[k];mn.classList.remove('on');
document.getElementById('m').innerHTML=s[2]();sel.value=k;document.getElementById('grp').textContent='Flujo: '+s[0];window.scrollTo(0,0)}
addEventListener('hashchange',go);go();
</script>
</body>
</html>
